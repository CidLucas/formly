<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formly · Entrar</title>
<style>
:root {
  --wine: #7A2E3F; --wine-dark: #5C1E2C;
  --paper: #E7E6E0; --card: #FCFBF8; --muted: #6E6D66; --line: #C9C7BE;
  --display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --body: Georgia, 'Times New Roman', Times, serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
  --r: 6px; --rl: 12px;
  --ease: cubic-bezier(.4,0,.2,1);
  --fast: 150ms;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; height: 100%; }
body {
  font-family: var(--body);
  color: #1a1a1a;
  background: var(--paper);
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
}
.auth {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 20px;
  text-align: center;
  padding: 40px 24px;
  width: 100%;
  max-width: 360px;
}
.logo {
  font-family: var(--display);
  font-size: 1.6rem;
  font-weight: 700;
  color: var(--wine);
  letter-spacing: -0.03em;
  margin-bottom: 4px;
}
.title {
  font-family: var(--display);
  font-size: 1.15rem;
  font-weight: 600;
}
.subtitle {
  font-family: var(--body);
  font-size: 0.88rem;
  color: var(--muted);
  max-width: 280px;
  line-height: 1.5;
}
.btn-google {
  display: flex; align-items: center; justify-content: center; gap: 12px;
  width: 100%; padding: 14px 20px;
  font-family: var(--display); font-size: 0.9rem; font-weight: 500;
  color: #1a1a1a; background: #fff;
  border: 1.5px solid var(--line); border-radius: var(--r);
  cursor: pointer; transition: all var(--fast) var(--ease);
}
.btn-google:hover { border-color: #aaa; background: #fafafa; }
.divider {
  display: flex; align-items: center; gap: 12px;
  width: 100%; max-width: 320px;
  font-family: var(--mono); font-size: 0.66rem; color: var(--muted);
  text-transform: uppercase;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }
.email-form { display: flex; flex-direction: column; gap: 12px; width: 100%; }
.email-input {
  padding: 14px; font-family: var(--body); font-size: 0.9rem; color: #1a1a1a;
  background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r);
  outline: none; transition: border var(--fast) var(--ease);
}
.email-input:focus { border-color: var(--wine); }
.email-input::placeholder { color: var(--muted); font-style: italic; }
.btn-primary {
  padding: 14px; font-family: var(--display); font-size: 0.9rem; font-weight: 600;
  color: #fff; background: var(--wine); border: none; border-radius: var(--r);
  cursor: pointer; transition: background var(--fast) var(--ease);
}
.btn-primary:hover { background: var(--wine-dark); }
</style>
</head>
<body>

<div class="auth">
  <div class="logo">formly</div>
  <div class="title">Só mais uma coisa</div>
  <div class="subtitle">Crie uma conta rapidinho para salvar seu questionário.</div>

  <button class="btn-google" onclick="go('builder.html')">
    <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 01-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
    Continuar com Google
  </button>

  <div class="divider">ou</div>

  <form class="email-form" onsubmit="event.preventDefault(); go('builder.html')">
    <input type="email" class="email-input" placeholder="seu@email.com" required>
    <button type="submit" class="btn-primary">Entrar com e-mail</button>
  </form>
</div>

<script>
function go(url) { window.location.href = url; }
</script>
</body>
</html>
