<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formly · Enviar</title>
<style>
:root {
  --wine: #7A2E3F; --wine-soft: #F5E8EB; --wine-dark: #5C1E2C;
  --pine: #3B5B52; --pine-soft: #E8F0ED;
  --paper: #E7E6E0; --paper2: #F3F2EE; --card: #FCFBF8;
  --muted: #6E6D66; --line: #C9C7BE;
  --display: 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --body: Georgia, 'Times New Roman', Times, serif;
  --mono: 'SF Mono', 'Fira Code', monospace;
  --s: 8px; --m: 16px; --l: 24px; --xl: 40px;
  --r: 6px; --rl: 12px;
  --ease: cubic-bezier(.4,0,.2,1);
  --fast: 150ms;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-font-smoothing: antialiased; }
body {
  font-family: var(--body);
  color: #1a1a1a;
  background: var(--paper);
  min-height: 100vh;
}
.app { max-width: 560px; margin: 0 auto; padding: var(--xl) var(--l); }

.back {
  font-family: var(--display); font-size: 0.85rem; color: var(--muted);
  cursor: pointer; background: none; border: none; padding: 0; margin-bottom: var(--l);
  display: inline-block;
}
.back:hover { color: var(--wine); }

.title {
  font-family: var(--display); font-size: 1.1rem; font-weight: 600; margin-bottom: var(--l);
}
.section-label {
  font-family: var(--display); font-size: 0.85rem; font-weight: 600; margin-bottom: var(--s);
}

.search {
  width: 100%; padding: var(--m); font-family: var(--body); font-size: 0.9rem;
  color: #1a1a1a; background: var(--card); border: 1.5px solid var(--line);
  border-radius: var(--r); outline: none;
}
.search:focus { border-color: var(--wine); }

.select-all {
  display: flex; align-items: center; gap: var(--s);
  font-family: var(--display); font-size: 0.85rem; font-weight: 500;
  cursor: pointer; padding: var(--s) 0; color: var(--wine);
  margin-top: var(--m);
}

.contact-list {
  display: flex; flex-direction: column; gap: 2px;
  max-height: 200px; overflow-y: auto; padding-right: 4px;
}
.contact {
  display: flex; align-items: center; gap: var(--m); padding: var(--s) var(--m);
  border-radius: var(--r); cursor: pointer; font-family: var(--body); font-size: 0.88rem;
  transition: background var(--fast);
}
.contact:hover { background: var(--paper2); }
.contact.selected { background: var(--wine-soft); }
.contact .check {
  width: 18px; height: 18px; border-radius: 3px; border: 2px solid var(--line);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 0.65rem; color: transparent;
}
.contact.selected .check { border-color: var(--wine); background: var(--wine); color: #fff; }

.divider {
  display: flex; align-items: center; gap: var(--m); margin: var(--l) 0;
  font-family: var(--mono); font-size: 0.66rem; color: var(--muted);
  text-transform: uppercase;
}
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--line); }

.csv-zone {
  display: flex; align-items: center; justify-content: center; gap: var(--m);
  padding: var(--l); border: 2px dashed var(--line); border-radius: var(--rl);
  cursor: pointer; font-family: var(--body); font-size: 0.85rem; color: var(--muted);
  transition: all var(--fast);
}
.csv-zone:hover { border-color: var(--wine); background: var(--wine-soft); }

.msg-textarea {
  width: 100%; min-height: 70px; padding: var(--m);
  font-family: var(--body); font-size: 0.85rem; color: #1a1a1a;
  background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r);
  outline: none; resize: vertical;
}
.msg-textarea:focus { border-color: var(--wine); }
.msg-textarea::placeholder { color: var(--muted); font-style: italic; }

.btn-send {
  width: 100%; padding: var(--l); font-family: var(--display); font-size: 1rem;
  font-weight: 600; color: #fff; background: var(--wine); border: none;
  border-radius: var(--r); cursor: pointer; display: flex; align-items: center;
  justify-content: center; gap: var(--s); transition: background var(--fast);
  margin-top: var(--l);
}
.btn-send:hover { background: var(--wine-dark); }
.btn-send:disabled { opacity: .5; cursor: not-allowed; }

@media (max-width: 600px) { .app { padding: var(--l) var(--m); } }
</style>
</head>
<body>

<div class="app">
  <button class="back" onclick="go('builder.html')">← Voltar</button>

  <div class="title">Enviar: Pesquisa de Clima 2026</div>

  <div class="section-label">Para quem?</div>
  <input type="text" class="search" placeholder="Buscar contatos...">

  <div class="select-all" id="select-all" onclick="toggleAll()">
    <span class="check">✓</span>
    <span>Todos (4)</span>
  </div>

  <div class="contact-list" id="contact-list">
    <div class="contact selected" onclick="toggle(this)"><span class="check">✓</span> ana@empresa.com.br</div>
    <div class="contact selected" onclick="toggle(this)"><span class="check">✓</span> carlos@empresa.com.br</div>
    <div class="contact" onclick="toggle(this)"><span class="check">✓</span> julia@empresa.com.br</div>
    <div class="contact selected" onclick="toggle(this)"><span class="check">✓</span> marcos@empresa.com.br</div>
  </div>

  <div class="divider">ou</div>

  <div class="csv-zone" onclick="simCsv()" id="csv-zone">
    <span>☁</span>
    <span>Subir arquivo com e-mails (um por linha)</span>
  </div>

  <div style="margin-top:var(--l)">
    <div class="section-label">Mensagem opcional</div>
    <textarea class="msg-textarea" placeholder="Olá! Sua opinião é importante..."></textarea>
  </div>

  <button class="btn-send" onclick="send()">Enviar questionário →</button>
</div>

<script>
function go(url) { window.location.href = url; }

function toggle(el) { el.classList.toggle('selected'); updateAll(); }
function toggleAll() {
  const all = document.querySelectorAll('#contact-list .contact');
  const anyOff = Array.from(all).some(c => !c.classList.contains('selected'));
  all.forEach(c => { if (anyOff) c.classList.add('selected'); else c.classList.remove('selected'); });
  updateAll();
}
function updateAll() {
  const sel = document.querySelectorAll('#contact-list .contact.selected').length;
  const total = document.querySelectorAll('#contact-list .contact').length;
  document.querySelector('#select-all span:last-child').textContent =
    sel === total ? 'Todos (' + total + ')' : 'Selecionados (' + sel + ')';
}
function simCsv() {
  var z = document.getElementById('csv-zone');
  z.innerHTML = '<span style="font-family:var(--body);color:#1a1a1a;">📄 contatos.csv · 12 contatos detectados</span>';
  z.style.borderColor = 'var(--pine)';
  z.style.background = 'var(--pine-soft)';
}
function send() {
  var btn = document.querySelector('.btn-send');
  btn.textContent = 'Enviando...';
  btn.disabled = true;
  setTimeout(function() { window.location.href = 'analytics.html'; }, 1500);
}
</script>

</body>
</html>
