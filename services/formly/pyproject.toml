[project]
name = "formly"
version = "0.1.0"
description = "Formly backend — FastAPI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0",
    "psycopg2-binary>=2.9",
    "supabase>=2.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.12",
    "boto3>=1.35",
    "groq>=0.15",
    "httpx>=0.28",
    "python-dotenv>=1.0",
    # libs do monorepo (instalar em editable mode):
    # pip install -e ../../monorepo/libs/blu_auth
    # pip install -e ../../monorepo/libs/blu_supabase_client
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
]
